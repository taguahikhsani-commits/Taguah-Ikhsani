{% extends "base.html" %}{% block title %}{{ 'Edit Berita' if article else 'Tambah Berita' }}{% endblock %}{% block content %}<section class="container py-5"><div class="mb-4"><a href="{{ url_for('admin.articles') }}" class="text-danger"><i class="bi bi-arrow-left me-2"></i>Kembali ke berita</a><h1 class="h2 fw-bold mt-3">{{ 'Edit Berita' if article else 'Tambah Berita' }}</h1></div><form method="post" class="contact-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label" for="title">Judul</label><input class="form-control" id="title" name="title" maxlength="220" value="{{ article.title if article else '' }}" required></div><div class="mb-3"><label class="form-label" for="excerpt">Ringkasan</label><textarea class="form-control" id="excerpt" name="excerpt" rows="2" maxlength="500">{{ article.excerpt if article else '' }}</textarea></div><div class="mb-3"><label class="form-label" for="body">Isi berita</label><textarea class="form-control" id="body" name="body" rows="12" required>{{ article.body if article else '' }}</textarea><div class="form-text">Isi ditampilkan sebagai teks biasa, bukan HTML.</div></div><div class="mb-4"><label class="form-label" for="status">Status</label><select class="form-select" id="status" name="status"><option value="draft" {{ 'selected' if article and article.status == 'draft' else '' }}>Draft</option><option value="published" {{ 'selected' if article and article.status == 'published' else '' }}>Publikasikan</option></select></div><button class="btn btn-pti" type="submit">Simpan berita</button><a class="btn btn-outline-secondary ms-2" href="{{ url_for('admin.articles') }}">Batal</a></form></section>{% endblock %}
