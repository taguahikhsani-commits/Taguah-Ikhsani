{% extends "base.html" %}{% block title %}Login Admin{% endblock %}{% block content %}<section class="login-wrap"><form method="post" class="login-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="brand-mark mx-auto mb-3">PTI</div><h1 class="h3 text-center fw-bold">Login Pengelola</h1><p class="text-secondary text-center mb-4">Masuk untuk mengelola konten situs.</p><label class="form-label" for="email">Email</label><input class="form-control mb-3" type="email" name="email" id="email" autocomplete="username" required><label class="form-label" for="password">Kata sandi</label><input class="form-control mb-4" type="password" name="password" id="password" autocomplete="current-password" required><button class="btn btn-pti w-100" type="submit">Masuk</button><a class="d-block text-center mt-3" href="{{ url_for('public.index') }}">Kembali ke situs</a></form></section>{% endblock %}
